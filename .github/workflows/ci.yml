name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build toolchain
        shell: pwsh
        run: choco install make mingw -y --no-progress

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Generate
        run: make generate

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Test
        run: make test

      - name: Check clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "working tree is dirty after generate/build"
            exit 1
          fi
